<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QA Hub - Admin Dashboard</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 1300px;
    margin: auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.card {
    background: white;
    padding: 22px;
    margin-top: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #ddd;
}

button {
    background: #2563eb;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.logout {
    background: #dc2626;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1100px;
    margin-top: 15px;
}

th, td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: left;
}

th {
    background: #172554;
    color: white;
}

input, select {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
    width: 130px;
}

.table-wrapper {
    overflow-x: auto;
}

.message {
    font-weight: bold;
    margin-top: 15px;
}

.success {
    color: green;
}

.error {
    color: red;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>🛠️ QA Hub - Admin Dashboard</h1>

        <button class="logout" id="logoutBtn">
            Logout
        </button>

    </div>

    <div class="card">

        <h2>Welcome, Admin!</h2>

        <p>
            Logged in as:
            <strong id="adminEmail">Checking login...</strong>
        </p>

    </div>

    <div class="card">

        <h2>🐞 All Reported Bugs</h2>

        <button id="refreshBtn">
            Refresh Bugs
        </button>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Bug ID</th>
                        <th>Title</th>
                        <th>Severity</th>
                        <th>Priority</th>
                        <th>Developer Email</th>
                        <th>Team</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="bugTable">

                    <tr>
                        <td colspan="8">Checking...</td>
                    </tr>

                </tbody>

            </table>

        </div>

        <p id="message" class="message"></p>

    </div>

</div>


<script type="module">

import { supabase } from "./js/supabase.js";

const adminEmail = document.getElementById("adminEmail");

const bugTable = document.getElementById("bugTable");

const message = document.getElementById("message");

const refreshBtn = document.getElementById("refreshBtn");

const logoutBtn = document.getElementById("logoutBtn");


function showMessage(text, type = "") {

    message.textContent = text;

    message.className = "message " + type;

}


function escapeHTML(value) {

    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    }[char]));

}


// CHECK LOGIN AND ADMIN ROLE

async function checkAdmin() {

    try {

        const { data: { session }, error } =
            await supabase.auth.getSession();

        if (error) {
            throw error;
        }

        if (!session) {

            window.location.href = "login.html";

            return false;

        }

        adminEmail.textContent = session.user.email;

        console.log("Logged in email:", session.user.email);

        console.log("User ID:", session.user.id);


        // CHECK PROFILE

        const { data: profile, error: profileError } =
            await supabase
            .from("profiles")
            .select("role")
            .eq("id", session.user.id)
            .maybeSingle();


        console.log("Profile:", profile);

        console.log("Profile Error:", profileError);


        if (profileError) {

            adminEmail.textContent = "Profile verification failed";

            showMessage(
                "Unable to verify admin role: " + profileError.message,
                "error"
            );

            return false;

        }


        if (!profile) {

            adminEmail.textContent = "Profile not found";

            showMessage(
                "No profile found for this account.",
                "error"
            );

            return false;

        }


        if (profile.role !== "admin") {

            alert("Access Denied! Admin only.");

            window.location.href = "dashboard.html";

            return false;

        }


        console.log("Admin access granted!");

        return true;

    }

    catch (error) {

        console.error("Authentication error:", error);

        showMessage(error.message, "error");

        return false;

    }

}


// LOAD ALL REPORTED BUGS

async function loadBugs() {

    bugTable.innerHTML =
        "<tr><td colspan='8'>Loading bugs...</td></tr>";

    showMessage("");


    try {

        const { data: bugs, error } =
            await supabase
            .from("bugs")
            .select("*")
            .order("id", { ascending: false });


        if (error) {

            throw error;

        }


        bugTable.innerHTML = "";


        if (!bugs || bugs.length === 0) {

            bugTable.innerHTML =
                "<tr><td colspan='8'>No bugs found.</td></tr>";

            return;

        }


        bugs.forEach(bug => {

            const row = document.createElement("tr");

            const id = escapeHTML(bug.id);

            const priority = bug.priority || "Medium";

            const status = bug.status || "Open";


            row.innerHTML = `

                <td>${escapeHTML(bug.bug_code || bug.id)}</td>

                <td>${escapeHTML(bug.title)}</td>

                <td>${escapeHTML(bug.severity)}</td>

                <td>

                    <select class="priority"
                    data-id="${id}">

                        <option value="Low"
                        ${priority === "Low" ? "selected" : ""}>
                        Low
                        </option>

                        <option value="Medium"
                        ${priority === "Medium" ? "selected" : ""}>
                        Medium
                        </option>

                        <option value="High"
                        ${priority === "High" ? "selected" : ""}>
                        High
                        </option>

                        <option value="Critical"
                        ${priority === "Critical" ? "selected" : ""}>
                        Critical
                        </option>

                    </select>

                </td>


                <td>

                    <input type="email"
                    class="developer"
                    data-id="${id}"
                    value="${escapeHTML(bug.developer_email)}"
                    placeholder="Developer email">

                </td>


                <td>

                    <input type="text"
                    class="team"
                    data-id="${id}"
                    value="${escapeHTML(bug.team)}"
                    placeholder="Team">

                </td>


                <td>

                    <select class="status"
                    data-id="${id}">

                        <option value="Open"
                        ${status === "Open" ? "selected" : ""}>
                        Open
                        </option>

                        <option value="In Progress"
                        ${status === "In Progress" ? "selected" : ""}>
                        In Progress
                        </option>

                        <option value="Resolved"
                        ${status === "Resolved" ? "selected" : ""}>
                        Resolved
                        </option>

                    </select>

                </td>


                <td>

                    <button class="save"
                    data-id="${id}">
                    Save
                    </button>

                </td>

            `;


            bugTable.appendChild(row);

        });


        showMessage(
            bugs.length + " bugs loaded successfully!",
            "success"
        );

    }

    catch (error) {

        console.error("Bug loading error:", error);

        bugTable.innerHTML =
            "<tr><td colspan='8'>Unable to load bugs.</td></tr>";

        showMessage(
            "Error loading bugs: " + error.message,
            "error"
        );

    }

}


// SAVE BUG ASSIGNMENT AND UPDATES

bugTable.addEventListener("click", async event => {

    if (!event.target.classList.contains("save")) {
        return;
    }


    const id = event.target.dataset.id;


    const developer = bugTable.querySelector(
        `.developer[data-id="${CSS.escape(id)}"]`
    ).value.trim();


    const team = bugTable.querySelector(
        `.team[data-id="${CSS.escape(id)}"]`
    ).value.trim();


    const priority = bugTable.querySelector(
        `.priority[data-id="${CSS.escape(id)}"]`
    ).value;


    const status = bugTable.querySelector(
        `.status[data-id="${CSS.escape(id)}"]`
    ).value;


    // EMAIL VALIDATION

    if (
        developer &&
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(developer)
    ) {

        showMessage(
            "Please enter a valid developer email.",
            "error"
        );

        return;

    }


    event.target.disabled = true;

    event.target.textContent = "Saving...";


    try {

        const { error } = await supabase
            .from("bugs")
            .update({

                developer_email: developer || null,

                team: team || null,

                priority: priority,

                status: status

            })
            .eq("id", id);


        if (error) {

            throw error;

        }


        showMessage(
            "Bug updated successfully!",
            "success"
        );

        event.target.textContent = "Saved";


    }

    catch (error) {

        console.error("Update error:", error);

        showMessage(
            "Update failed: " + error.message,
            "error"
        );

        event.target.textContent = "Save";

    }

    finally {

        event.target.disabled = false;

    }

});


// REFRESH BUGS

refreshBtn.addEventListener("click", loadBugs);


// LOGOUT

logoutBtn.addEventListener("click", async () => {

    const { error } = await supabase.auth.signOut();

    if (error) {

        alert("Logout failed: " + error.message);

        return;

    }

    window.location.href = "login.html";

});


// START DASHBOARD

const isAdmin = await checkAdmin();

if (isAdmin) {

    await loadBugs();

}

</script>

</body>
</html>

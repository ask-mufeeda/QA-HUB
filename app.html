<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QA Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #172554;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        header span {
            color: #38bdf8;
        }

        #logoutBtn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .layout {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        nav {
            width: 230px;
            background: white;
            padding: 20px;
        }

        nav button {
            display: block;
            width: 100%;
            padding: 13px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            text-align: left;
            cursor: pointer;
            background: #f1f5f9;
        }

        nav button.active {
            background: #2563eb;
            color: white;
        }

        main {
            flex: 1;
            padding: 25px;
            min-width: 0;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .hidden {
            display: none !important;
        }

        @media(max-width: 700px) {
            .layout {
                flex-direction: column;
            }

            nav {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>QA<span>Hub</span></h1>
    <button id="logoutBtn">Logout</button>
</header>

<div class="layout">

    <nav>
        <h3>Navigation</h3>
        <div id="navigation"></div>
    </nav>

    <main>

        <div class="card">
            <h2 id="pageTitle">Welcome to QA Hub</h2>
            <p id="userInfo">Loading account...</p>
        </div>

        <section id="appContent">
            <div class="card">
                <h2>Welcome!</h2>
                <p>Loading your dashboard...</p>
            </div>
        </section>

        <p id="message"></p>

    </main>

</div>

<script type="module" src="js/main.js"></script>

</body>
</html>

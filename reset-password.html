<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | QA Hub</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>QA<span>Hub</span></h1>

        <h2>Create New Password</h2>

        <p>Enter your new password below.</p>

        <form id="resetForm">

            <label>New Password</label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                required
                minlength="6"
            >

            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                required
                minlength="6"
            >

            <button type="submit" id="updateBtn" disabled>
                Checking Reset Link...
            </button>

            <p id="message"></p>

        </form>

        <a href="login.html">Back to Login</a>

    </div>

</div>

<script type="module">

import { supabase } from "./js/supabase.js";

const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const updateBtn = document.getElementById("updateBtn");

let sessionReady = false;

// Check recovery session

async function checkSession() {

    message.textContent = "Verifying reset link...";

    try {

        // Handle PKCE recovery links
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get("code");

        if (code) {

            const { error } =
                await supabase.auth.exchangeCodeForSession(code);

            if (error) throw error;

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

        }

        // Handle token-based recovery links
        const hashParams = new URLSearchParams(
            window.location.hash.substring(1)
        );

        const accessToken = hashParams.get("access_token");
        const refreshToken = hashParams.get("refresh_token");

        if (accessToken && refreshToken) {

            const { error } = await supabase.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken
            });

            if (error) throw error;

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

        }

        // Check whether session exists

        const { data, error } =
            await supabase.auth.getSession();

        if (error) throw error;

        if (!data.session) {

            throw new Error(
                "Reset session missing. Please request a new password reset link."
            );

        }

        sessionReady = true;

        updateBtn.disabled = false;

        updateBtn.textContent = "Update Password";

        message.textContent = "Reset link verified. Enter your new password.";

    } catch (error) {

        message.textContent = error.message;

        updateBtn.disabled = true;

        console.error(error);

    }

}

checkSession();


// Update password

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    if (!sessionReady) {

        message.textContent = "Please verify your reset link first.";

        return;

    }

    const password =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {

        message.textContent = "Passwords do not match.";

        return;

    }

    updateBtn.disabled = true;

    message.textContent = "Updating password...";

    try {

        const { data, error } =
            await supabase.auth.updateUser({
                password: password
            });

        if (error) throw error;

        message.textContent =
            "Password updated successfully! Redirecting to login...";

        setTimeout(() => {

            window.location.href = "login.html";

        }, 2500);

    } catch (error) {

        message.textContent = error.message;

        updateBtn.disabled = false;

    }

});

</script>

</body>
</html>

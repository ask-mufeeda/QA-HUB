<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QA Hub - Developer Dashboard</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

h1 {
    color: #263238;
}

.card {
    background: white;
    padding: 22px;
    margin-top: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
    margin-top: 15px;
}

th, td {
    padding: 13px;
    border: 1px solid #ddd;
    text-align: left;
}

th {
    background: #172554;
    color: white;
}

.table-wrapper {
    overflow-x: auto;
}

button, select {
    padding: 9px 13px;
    border: none;
    border-radius: 5px;
}

button {
    background: #2563eb;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

select {
    border: 1px solid #ccc;
}

.logout {
    background: #dc2626;
}

.attachment {
    color: #2563eb;
    font-weight: bold;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}

.error {
    color: red;
}

.success {
    color: green;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

    <h1>👨‍💻 QA Hub - Developer Dashboard</h1>

    <button class="logout" id="logoutBtn">
        Logout
    </button>

</div>


<div class="card">

    <h2>Welcome, Developer!</h2>

    <p>
        Logged in as:
        <strong id="developerEmail">Loading...</strong>
    </p>

</div>


<div class="card">

    <h2>🐞 My Assigned Bugs</h2>

    <p>
        These are the bugs assigned to your email address.
    </p>

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>
                    <th>Bug ID</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Severity</th>
                    <th>Priority</th>
                    <th>Team</th>
                    <th>Screenshot</th>
                    <th>Recording</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody id="bugTable">

                <tr>
                    <td colspan="9">Loading assigned bugs...</td>
                </tr>

            </tbody>

        </table>

    </div>

    <p id="message" class="message"></p>

</div>

</div>


<script type="module">

import { supabase } from "./js/supabase.js";


// GET HTML ELEMENTS

const developerEmail =
    document.getElementById("developerEmail");

const bugTable =
    document.getElementById("bugTable");

const message =
    document.getElementById("message");

const logoutBtn =
    document.getElementById("logoutBtn");


// CHECK LOGIN

const { data: { session }, error: sessionError } =
    await supabase.auth.getSession();

if (sessionError) {

    alert("Login error: " + sessionError.message);

    throw sessionError;

}

if (!session) {

    window.location.href = "login.html";

    throw new Error("Please login first");

}


// GET LOGGED-IN DEVELOPER EMAIL

const email = session.user.email;

developerEmail.textContent = email;


// ESCAPE HTML

function escapeHTML(value) {

    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    }[char]));

}


// SHOW MESSAGE

function showMessage(text, type) {

    message.textContent = text;

    message.className = "message " + type;

}


// LOAD ASSIGNED BUGS

async function loadAssignedBugs() {

    bugTable.innerHTML =
        "<tr><td colspan='9'>Loading bugs...</td></tr>";

    const { data: bugs, error } = await supabase
        .from("bugs")
        .select("*")
        .ilike("developer_email", email)
        .order("id", { ascending: false });


    if (error) {

        bugTable.innerHTML =
            "<tr><td colspan='9'>Unable to load bugs.</td></tr>";

        showMessage(
            "Database error: " + error.message,
            "error"
        );

        console.error(error);

        return;

    }


    bugTable.innerHTML = "";

    if (!bugs || bugs.length === 0) {

        bugTable.innerHTML =
            "<tr><td colspan='9'>No bugs assigned to your email yet.</td></tr>";

        return;

    }


    bugs.forEach(bug => {

        const row = document.createElement("tr");

        const screenshot = bug.screenshot_url

            ? `<a class="attachment"
                href="${escapeHTML(bug.screenshot_url)}"
                target="_blank"
                rel="noopener">
                View Screenshot
               </a>`

            : "No Screenshot";


        const recording = bug.recording_url

            ? `<a class="attachment"
                href="${escapeHTML(bug.recording_url)}"
                target="_blank"
                rel="noopener">
                View Recording
               </a>`

            : "No Recording";


        row.innerHTML = `

            <td>${escapeHTML(bug.bug_code || bug.id)}</td>

            <td>${escapeHTML(bug.title)}</td>

            <td>${escapeHTML(bug.description)}</td>

            <td>${escapeHTML(bug.severity)}</td>

            <td>${escapeHTML(bug.priority)}</td>

            <td>${escapeHTML(bug.team || "Not Assigned")}</td>

            <td>${screenshot}</td>

            <td>${recording}</td>

            <td>

                <select
                    class="statusSelect"
                    data-id="${escapeHTML(bug.id)}">

                    <option value="Open"
                    ${bug.status === "Open" ? "selected" : ""}>
                    Open
                    </option>

                    <option value="In Progress"
                    ${bug.status === "In Progress" ? "selected" : ""}>
                    In Progress
                    </option>

                    <option value="Resolved"
                    ${bug.status === "Resolved" ? "selected" : ""}>
                    Resolved
                    </option>

                </select>

            </td>

        `;

        bugTable.appendChild(row);

    });

}


// UPDATE BUG STATUS

bugTable.addEventListener("change", async function(event) {

    if (!event.target.classList.contains("statusSelect")) {
        return;
    }

    const bugId = event.target.dataset.id;

    const newStatus = event.target.value;

    const { error } = await supabase
        .from("bugs")
        .update({ status: newStatus })
        .eq("id", bugId)
        .ilike("developer_email", email);


    if (error) {

        showMessage(
            "Status update failed: " + error.message,
            "error"
        );

        console.error(error);

        return;

    }

    showMessage(
        "Bug status updated successfully!",
        "success"
    );

});


// LOGOUT

logoutBtn.addEventListener("click", async function() {

    const { error } = await supabase.auth.signOut();

    if (error) {

        alert("Logout failed: " + error.message);

        return;

    }

    window.location.href = "login.html";

});


// INITIAL LOAD

loadAssignedBugs();

</script>

</body>
</html>

```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | QA Hub</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>QA<span>Hub</span></h1>

        <h2>Welcome Back!</h2>

        <p>Login to continue your QA journey.</p>

        <form id="loginForm">

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <div class="forgot">

                <a href="#" id="forgotPassword">
                    Forgot Password?
                </a>

            </div>

            <button type="submit" id="loginBtn">
                Login
            </button>

            <p id="message"></p>

        </form>

        <p class="auth-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>


<script type="module">

import { supabase } from "./js/supabase.js";


const form = document.getElementById("loginForm");

const message = document.getElementById("message");

const loginBtn = document.getElementById("loginBtn");

const forgotPassword = document.getElementById("forgotPassword");


// DISPLAY MESSAGE

function showMessage(text, color = "red") {

    message.textContent = text;

    message.style.color = color;

}


// LOGIN

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    const password = document.getElementById("password").value;

    loginBtn.disabled = true;

    loginBtn.textContent = "Logging in...";

    showMessage("Checking login details...", "blue");

    let loginSuccessful = false;

    try {

        // STEP 1: SUPABASE AUTHENTICATION

        const { data, error } =
            await supabase.auth.signInWithPassword({

                email,

                password

            });

        if (error) throw error;

        loginSuccessful = true;

        const user = data.user;

        if (!user) {

            throw new Error("User not found.");

        }


        // STEP 2: FETCH USER ROLE

        showMessage("Checking account role...", "blue");

        const { data: profile, error: profileError } =

            await supabase

                .from("profiles")

                .select("role")

                .eq("id", user.id)

                .maybeSingle();


        if (profileError) {

            throw new Error(
                "Profile verification failed: " +
                profileError.message
            );

        }


        if (!profile) {

            throw new Error("User profile not found.");

        }


        const role = String(profile.role || "")

            .trim()

            .toLowerCase();


        // STEP 3: VERIFY USER ROLE

        const allowedRoles = [

            "admin",

            "tester",

            "developer"

        ];


        if (!allowedRoles.includes(role)) {

            throw new Error("Unknown role: " + role);

        }


        // STEP 4: ALL USERS ENTER THE SAME SPA

        const destination = "app.html";


        showMessage(

            "Login successful! Opening QA Hub...",

            "green"

        );


        // REDIRECT TO MAIN APPLICATION

        window.location.replace(destination);


    }

    catch (error) {

        console.error("Login error:", error);

        showMessage(error.message);

        if (loginSuccessful) {

            await supabase.auth.signOut();

        }

        loginBtn.disabled = false;

        loginBtn.textContent = "Login";

    }

});



// FORGOT PASSWORD

forgotPassword.addEventListener("click", async (event) => {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();


    if (!email) {

        showMessage("Please enter your email address first.");

        return;

    }


    showMessage("Sending password reset email...", "blue");


    try {

        const { error } =

            await supabase.auth.resetPasswordForEmail(email, {

                redirectTo:

                    `${window.location.origin}/reset-password.html`

            });


        if (error) throw error;


        showMessage(

            "Password reset link sent! Check your email.",

            "green"

        );

    }

    catch (error) {

        showMessage(error.message);

    }

});

</script>

</body>


</html>
